name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check src app.py store_index.py benchmark.py

      - name: Run tests
        run: pytest -q

  build-and-push:
    name: Build image and push to ECR
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$TAG -t $REGISTRY/$ECR_REPOSITORY:latest .
          docker push $REGISTRY/$ECR_REPOSITORY:$TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$REGISTRY/$ECR_REPOSITORY:$TAG" >> $GITHUB_OUTPUT

  deploy:
    name: Roll out to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Pull the new image and restart the container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            docker pull ${{ needs.build-and-push.outputs.image }}

            docker rm -f healix || true
            docker run -d \
              --name healix \
              --restart unless-stopped \
              -p 80:8080 \
              -e OPENAI_API_KEY='${{ secrets.OPENAI_API_KEY }}' \
              -e PINECONE_API_KEY='${{ secrets.PINECONE_API_KEY }}' \
              -e VECTOR_BACKEND='${{ secrets.VECTOR_BACKEND }}' \
              -e PINECONE_INDEX_NAME='${{ secrets.PINECONE_INDEX_NAME }}' \
              -v /opt/healix/artifacts:/app/artifacts \
              ${{ needs.build-and-push.outputs.image }}

            docker image prune -f

      - name: Verify the deployment is healthy
        run: |
          for attempt in $(seq 1 10); do
            if curl -fsS http://${{ secrets.EC2_HOST }}/health; then
              echo "Healthy."
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 10s."
            sleep 10
          done
          echo "Service did not become healthy."
          exit 1
