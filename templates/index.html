<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Healix — ask the medical encyclopedia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

  <header class="masthead">
    <div class="wrap masthead-inner">
      <div>
        <h1 class="wordmark">Healix</h1>
        <p class="masthead-sub">Answers drawn from one medical encyclopedia, with the pages they came from.</p>
      </div>
      <dl class="corpus-stats">
        <div><dt>Pages</dt><dd>637</dd></div>
        <div><dt>Passages</dt><dd>1,500</dd></div>
        <div><dt>Model</dt><dd>{{ model }}</dd></div>
      </dl>
    </div>
  </header>

  <main class="wrap">
    <div id="transcript" class="transcript" aria-live="polite" aria-atomic="false">
      <div class="empty-state" id="empty-state">
        <p class="empty-lead">Ask a question and Healix will quote the encyclopedia rather than its own memory.</p>
        <ul class="starters" id="starters">
          <li><button type="button" class="starter">What causes iron deficiency anaemia?</button></li>
          <li><button type="button" class="starter">How is type 2 diabetes diagnosed?</button></li>
          <li><button type="button" class="starter">Explain how vaccines produce immunity.</button></li>
        </ul>
      </div>
    </div>
  </main>

  <div class="composer-shell">
    <div class="wrap">
      <div class="composer">
        <label class="visually-hidden" for="question">Your question</label>
        <textarea id="question" rows="1" maxlength="500" placeholder="Ask about a condition or term…" autocomplete="off"></textarea>
        <button id="send" type="button" class="send">Ask</button>
      </div>
      <p class="composer-note">Reference information, not medical advice. Talk to a clinician about your own health.</p>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
