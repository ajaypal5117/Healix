name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:
  test:
    name: lint and test
    runs-on: ubuntu-latest
    env:
      # The suite runs without torch, model weights or an API key.
      EMBEDDING_BACKEND: hashing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check src scripts tests app.py
      - run: pytest -q

  build-and-push:
    name: build image and push to ECR
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: build, tag and push
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$TAG -t $REGISTRY/$ECR_REPOSITORY:latest .
          docker push $REGISTRY/$ECR_REPOSITORY:$TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$REGISTRY/$ECR_REPOSITORY:$TAG" >> $GITHUB_OUTPUT

  deploy:
    name: roll out to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: pull and restart the container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            docker pull ${{ needs.build-and-push.outputs.image }}
            docker rm -f healix || true

            # The index is a volume, not part of the image: rebuilding it on
            # every deploy would add minutes to each rollout.
            docker run -d \
              --name healix \
              --restart unless-stopped \
              -p 80:8080 \
              -e OPENAI_API_KEY='${{ secrets.OPENAI_API_KEY }}' \
              -v /opt/healix/artifacts:/app/artifacts \
              -v /opt/healix/data:/app/data \
              ${{ needs.build-and-push.outputs.image }}

            docker image prune -f

      - name: verify the rollout is healthy
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsS http://${{ secrets.EC2_HOST }}/api/health; then
              echo "healthy"
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 10s"
            sleep 10
          done
          echo "service did not become healthy"
          exit 1
